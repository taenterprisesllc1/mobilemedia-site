# =====================================================================
# Mobile Media — Site Editor settings (Decap CMS)
# Open the editor at  https://mobilemedia.pro/admin
#
# ONE THING TO CHANGE BEFORE GOING LIVE:
#   repo: below must be taenterprisesllc1/mobilemedia-site
# =====================================================================

backend:
  name: github
  repo: taenterprisesllc1/mobilemedia-site
  branch: main

site_url: https://mobilemedia.pro
display_url: https://mobilemedia.pro
logo_url: /assets/images/logo.jpg

# Default upload folder (each field below can choose its own folder)
media_folder: assets/uploads
public_folder: /assets/uploads

collections:
  - name: content
    label: Website
    format: json
    editor:
      preview: false
    files:

      # ---------------------------------------------------------------
      - label: "Page Backgrounds"
        name: backgrounds
        file: content/backgrounds.json
        description: "The drone clip behind each page. Order: Home, Films, Gallery, Services, About, Reviews, Contact."
        fields:
          - label: "Pages"
            name: pages
            widget: list
            allow_add: false
            collapsed: true
            summary: "{{fields.place}}"
            fields:
              - { label: "Location label (shown in the corner)", name: place, widget: string }
              - label: "Background video"
                name: video
                widget: file
                media_folder: /assets/videos/backgrounds
                public_folder: /assets/videos/backgrounds
                hint: "MP4, 1080p, 10–30 seconds, ideally under 15 MB. Upload, or paste a video URL."
              - label: "Loading image (optional)"
                name: poster
                widget: image
                required: false
                media_folder: /assets/videos/backgrounds
                public_folder: /assets/videos/backgrounds
              - { label: "Sun glow — % from left (0–100, optional)", name: sunX, widget: number, value_type: int, min: 0, max: 100, required: false }
              - { label: "Sun glow — % from top (0–100, optional)", name: sunY, widget: number, value_type: int, min: 0, max: 100, required: false }
              - label: "Color adjustment (optional)"
                name: color
                widget: string
                required: false
                hint: "Examples: saturate(.8) = less color · brightness(1.1) = lighter · sepia(.1) = warmer. Combine with spaces."

      # ---------------------------------------------------------------
      - label: "Films (video portfolio)"
        name: films
        file: content/films.json
        description: "The first film is the big featured one."
        fields:
          - { label: "Small heading", name: eyebrow, widget: string }
          - { label: "Page title", name: heading, widget: string }
          - label: "Films"
            name: items
            widget: list
            collapsed: true
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: title, widget: string }
              - label: "Category"
                name: category
                widget: relation
                collection: content
                file: categories
                search_fields: ["categories.*.label"]
                display_fields: ["categories.*.label"]
                value_field: "categories.*.id"
              - label: "YouTube or Vimeo link"
                name: video
                widget: string
                required: false
                hint: "Paste any YouTube (incl. Shorts) or Vimeo link. Best for long or large films."
              - label: "…or upload a video file"
                name: file
                widget: file
                required: false
                media_folder: /assets/videos/films
                public_folder: /assets/videos/films
                hint: "MP4. If both are filled in, the uploaded file is used."
              - label: "Cover image (optional)"
                name: thumb
                widget: image
                required: false
                media_folder: /assets/videos/films
                public_folder: /assets/videos/films
                hint: "YouTube links and uploaded videos get a cover automatically."

      # ---------------------------------------------------------------
      - label: "Photo Gallery"
        name: gallery
        file: content/gallery.json
        fields:
          - { label: "Small heading", name: eyebrow, widget: string }
          - { label: "Page title", name: heading, widget: string }
          - { label: "Photos shown before “Load More”", name: perPage, widget: number, value_type: int, min: 2, max: 40, default: 8 }
          - label: "Photos"
            name: items
            widget: list
            collapsed: true
            summary: "{{fields.caption}} ({{fields.category}})"
            fields:
              - label: "Photo"
                name: photo
                widget: image
                media_folder: /assets/photos
                public_folder: /assets/photos
                hint: "JPG, about 2000 px wide, under ~1 MB."
              - label: "Category"
                name: category
                widget: relation
                collection: content
                file: categories
                search_fields: ["categories.*.label"]
                display_fields: ["categories.*.label"]
                value_field: "categories.*.id"
              - { label: "Caption (optional)", name: caption, widget: string, required: false }
              - label: "Small version for faster loading (optional)"
                name: thumb
                widget: image
                required: false
                media_folder: /assets/photos
                public_folder: /assets/photos

      # ---------------------------------------------------------------
      - label: "Services & Prices"
        name: services
        file: content/services.json
        fields:
          - { label: "Small heading", name: eyebrow, widget: string }
          - { label: "Page title", name: heading, widget: string }
          - label: "Services"
            name: items
            widget: list
            collapsed: true
            summary: "{{fields.title}} — {{fields.price}}"
            fields:
              - { label: "Service name", name: title, widget: string }
              - { label: "Starting price", name: price, widget: string, required: false, hint: "e.g. $350 — leave blank to hide the price" }
              - { label: "Description", name: text, widget: text }
              - { label: "Icon", name: icon, widget: select, options: ["camera", "video", "editing", "home", "star", "map", "drone", "clock"], default: "drone" }

      # ---------------------------------------------------------------
      - label: "Home Page"
        name: home
        file: content/home.json
        fields:
          - { label: "Small line above the title", name: eyebrow, widget: string }
          - { label: "Title — first line (white)", name: titleLine1, widget: string }
          - { label: "Title — second line (gold)", name: titleLine2, widget: string }
          - { label: "Tagline", name: tagline, widget: text }
          - { label: "Main button text", name: primaryButton, widget: string }
          - { label: "Second button text", name: secondaryButton, widget: string }

      # ---------------------------------------------------------------
      - label: "About"
        name: about
        file: content/about.json
        fields:
          - { label: "Small heading", name: eyebrow, widget: string }
          - { label: "Page title", name: heading, widget: string }
          - label: "Team / location photo"
            name: photo
            widget: image
            media_folder: /assets/images/team
            public_folder: /assets/images/team
          - { label: "Years flying (badge)", name: yearsFlying, widget: string, hint: "e.g. 8+" }
          - label: "Your story (paragraphs)"
            name: story
            widget: list
            field: { label: "Paragraph", name: paragraph, widget: text }
          - label: "Certifications"
            name: certifications
            widget: list
            field: { label: "Certification", name: item, widget: string }
          - label: "Gear"
            name: gear
            widget: list
            field: { label: "Item", name: item, widget: string }
          - label: "Team members"
            name: team
            widget: list
            summary: "{{fields.name}} — {{fields.role}}"
            fields:
              - { label: "Name", name: name, widget: string }
              - { label: "Role", name: role, widget: string }
              - label: "Headshot"
                name: photo
                widget: image
                required: false
                media_folder: /assets/images/team
                public_folder: /assets/images/team

      # ---------------------------------------------------------------
      - label: "Reviews"
        name: reviews
        file: content/reviews.json
        fields:
          - { label: "Small heading", name: eyebrow, widget: string }
          - { label: "Page title", name: heading, widget: string }
          - label: "Reviews"
            name: items
            widget: list
            collapsed: true
            summary: "{{fields.name}} — {{fields.role}}"
            fields:
              - { label: "Quote", name: quote, widget: text }
              - { label: "Client name", name: name, widget: string }
              - { label: "Client role / company", name: role, widget: string, required: false }

      # ---------------------------------------------------------------
      - label: "Contact Page"
        name: contact
        file: content/contact.json
        fields:
          - { label: "Small heading", name: eyebrow, widget: string }
          - { label: "Page title", name: heading, widget: string }
          - { label: "Intro text", name: intro, widget: text }
          - label: "“Service Type” dropdown choices"
            name: serviceOptions
            widget: list
            field: { label: "Choice", name: option, widget: string }
          - { label: "Message after sending", name: successMessage, widget: string }

      # ---------------------------------------------------------------
      - label: "Business Info & Social Links"
        name: business
        file: content/business.json
        fields:
          - { label: "Business name", name: name, widget: string }
          - label: "Logo"
            name: logo
            widget: image
            media_folder: /assets/images
            public_folder: /assets/images
          - { label: "City, State", name: city, widget: string }
          - { label: "Phone", name: phone, widget: string }
          - { label: "Email", name: email, widget: string }
          - { label: "Service area line", name: serviceArea, widget: string }
          - { label: "Credentials line (footer)", name: credentials, widget: string }
          - label: "Contact form address (Formspree)"
            name: formEndpoint
            widget: string
            required: false
            hint: "Leave BLANK to use Netlify's built-in form handling (recommended — set email alerts in Netlify → Forms). Only fill this in if you use a separate service like Formspree."
          - label: "Social links"
            name: social
            widget: object
            hint: "Leave a link blank to hide that icon."
            fields:
              - { label: "Instagram", name: instagram, widget: string, required: false }
              - { label: "YouTube", name: youtube, widget: string, required: false }
              - { label: "TikTok", name: tiktok, widget: string, required: false }
              - { label: "Facebook", name: facebook, widget: string, required: false }

      # ---------------------------------------------------------------
      - label: "Filter Categories"
        name: categories
        file: content/categories.json
        description: "The filter buttons on Films and Gallery."
        fields:
          - label: "Categories"
            name: categories
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { label: "Button label", name: label, widget: string }
              - { label: "Short id (lowercase, dashes, no spaces)", name: id, widget: string, pattern: ["^[a-z0-9-]+$", "Use lowercase letters, numbers and dashes only"] }

      # ---------------------------------------------------------------
      - label: "Search Engine (Google) Text"
        name: seo
        file: content/seo.json
        fields:
          - { label: "Page title", name: title, widget: string }
          - { label: "Description", name: description, widget: text }
